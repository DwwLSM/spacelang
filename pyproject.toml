[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "spacelang"
version = "0.0.0"
description = "SpaceLang core package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.scikit-build]
wheel.packages = ["spacelang"]
cmake.build-type = "Release"
sdist.include = ["csrc/**", "CMakeLists.txt"]

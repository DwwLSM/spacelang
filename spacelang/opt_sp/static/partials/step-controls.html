<nav class="step-controls" aria-label="Trace controls">
  <button type="button" data-step="first" aria-label="First step">⏮</button>
  <button type="button" data-step="back" aria-label="Previous step">⏪</button>
  <button type="button" data-step="forward" aria-label="Next step">⏩</button>
  <button id="autoplay-button" type="button" aria-label="Autoplay" aria-pressed="false">▶</button>
  <label class="autoplay-speed-control" for="autoplay-speed">
    <span>Speed</span>
    <input id="autoplay-speed" type="range" min="50" max="1500" step="50" value="1000" aria-label="Autoplay interval">
    <output id="autoplay-speed-label" for="autoplay-speed">1 s / step</output>
  </label>
  <button type="button" data-step="last" aria-label="Last step">⏭</button>
  <input id="step-slider" type="range" min="0" max="0" value="0" aria-label="Trace step">
  <output id="step-label">Step 0 / 0</output>
</nav>

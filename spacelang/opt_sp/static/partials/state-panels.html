<section class="state-panels">
  <details id="call-stack" class="panel" open>
    <summary>Call Stack</summary>
    <div class="panel-content"></div>
  </details>
  <div class="panel-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize Call Stack and Operand Stack panels"></div>
  <details id="operand-stack" class="panel" open>
    <summary>Operand Stack</summary>
    <div class="panel-content"></div>
  </details>
  <div class="panel-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize Operand Stack and Heap panels"></div>
  <details id="heap" class="panel" open>
    <summary>Heap / Objects</summary>
    <div class="panel-content"></div>
  </details>
  <div class="panel-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize Heap and Printed Output panels"></div>
  <details id="output" class="panel" open>
    <summary>Printed Output</summary>
    <div class="panel-content"></div>
  </details>
</section>

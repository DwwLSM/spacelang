<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="opt-sp-control-token" content="__OPT_SP_CONTROL_TOKEN__">
  <title>OPT_SP — SpaceLang Visual Debugger</title>
  <link rel="stylesheet" href="css/opt-sp.css?v=8">
  <script type="module" src="js/app.js?v=8"></script>
</head>
<body data-page="visualize">
  <!-- #include partials/app-header.html -->
  <main id="viz-root" class="viz-layout">
    <section class="code-panel panel">
      <h2 class="code-panel-header">
        <span>Program</span>
        <span class="code-panel-actions">
          <button id="download-button" type="button" aria-label="Download edited file" title="Download edited file">Download</button>
          <button id="overwrite-button" type="button" aria-label="Overwrite source file" title="Overwrite source file" disabled>Overwrite</button>
          <button id="live-edit-toggle" type="button" aria-pressed="false">Live edit</button>
        </span>
      </h2>
      <pre id="code-view" class="code-view"></pre>
      <textarea id="live-editor" class="live-editor" aria-label="Edit program in live mode" spellcheck="false" hidden></textarea>
      <div id="live-status" class="live-status" role="status" aria-live="polite" hidden></div>
    </section>
    <div class="column-resizer" role="separator" aria-orientation="vertical" aria-label="Resize Program and state panels" aria-valuemin="240" tabindex="0"></div>
    <!-- #include partials/state-panels.html -->
    <!-- #include partials/step-controls.html -->
  </main>
</body>
</html>

name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip build pytest twine

      - name: Build OPT_SP static assets
        run: |
          python tools/build_static.py
          python tools/build_static.py --check

      - name: Install package and test dependencies
        run: python -m pip install -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: |
          python tools/check_distribution.py dist/*
          python -m twine check dist/*

      - name: Check PyPI publishing secret
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::Configure the PYPI_API_TOKEN repository secret before publishing."
            exit 1
          fi

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

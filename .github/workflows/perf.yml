name: Native engine profile

on:
  pull_request:
    paths:
      - "csrc/**"
      - "benchmarks/**"
      - "CMakeLists.txt"
      - ".github/workflows/perf.yml"
  push:
    branches: [main]
    paths:
      - "csrc/**"
      - "benchmarks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Linux / GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Confirm the native engine was built
        run: python -c "import spacelang._spacelang_cpp as m; print(m.__file__)"
      - name: Profile
        run: python benchmarks/profile_vm.py --repeat 9 --warmup 2 --json profile.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-engine-profile
          path: profile.json
          if-no-files-found: error
